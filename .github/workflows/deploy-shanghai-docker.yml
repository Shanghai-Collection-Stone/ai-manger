name: deploy-shanghai-docker

permissions:
  contents: read

on:
  push:
    tags:
      - "shanghai-*"
      - "shanghai/**"
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的分支、commit 或 tag（留空使用当前选择的 ref）
        type: string
        required: false
        default: ""
      app_port:
        description: 宿主机端口，映射到容器 3011
        type: string
        required: false
        default: "3011"
      container_name:
        description: Docker 容器名
        type: string
        required: false
        default: "ai_manger_shanghai_app"
      image_keep:
        description: 保留最近几个 shanghai 镜像
        type: string
        required: false
        default: "3"

concurrency:
  group: deploy-shanghai-docker
  cancel-in-progress: false

jobs:
  # 编译放在 GitHub 托管 runner（16GB）上：tsc 峰值堆约 900MB，
  # 上海那台小内存机器的 node 默认堆上限（约 870MB）扛不住，必然 OOM。
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install pnpm globally
        run: |
          npm i -g pnpm@11.20.0
          pnpm -v

      - name: Compute pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'web/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      # 根锁文件包含后端与 web importer；必须保留 workspace 配置，
      # 才能让 pnpm-workspace.yaml 的 overrides 与 frozen lock 保持一致。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NestJS
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Build frontend pages
        run: pnpm --dir web run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          test -f dist/main.js || (echo "dist/main.js missing after build" && exit 1)
          test -d public/pages || (echo "public/pages missing after web build" && exit 1)
          du -sh dist public/pages

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-manger-shanghai-dist
          path: |
            dist
            public/pages
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on:
      - self-hosted
      - shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-manger-shanghai-dist
          path: .

      - name: Verify downloaded artifact
        run: |
          set -euo pipefail
          test -f dist/main.js || (echo "dist/main.js missing: artifact download failed" && exit 1)
          test -d public/pages || (echo "public/pages missing: artifact download failed" && exit 1)
          du -sh dist public/pages

      - name: Build image and restart container
        env:
          APP_PORT_INPUT: ${{ github.event.inputs.app_port || '3011' }}
          CONTAINER_NAME_INPUT: ${{ github.event.inputs.container_name || 'ai_manger_shanghai_app' }}
          IMAGE_KEEP_INPUT: ${{ github.event.inputs.image_keep || '3' }}
          # 没有单独的 SHANGHAI_ENV 时直接复用 newnew 的那份，不再新建 secret
          SHANGHAI_ENV: ${{ secrets.SHANGHAI_ENV }}
          SHANGHAI_ENV_B64: ${{ secrets.SHANGHAI_ENV_B64 }}
          NEWNEW_ENV: ${{ secrets.NEWNEW_ENV }}
          NEWNEW_ENV_B64: ${{ secrets.NEWNEW_ENV_B64 }}
        run: |
          set -euo pipefail

          APP_PORT="${APP_PORT_INPUT:-3011}"
          CONTAINER_NAME="${CONTAINER_NAME_INPUT:-ai_manger_shanghai_app}"
          IMAGE_KEEP="${IMAGE_KEEP_INPUT:-3}"
          if ! printf '%s' "$IMAGE_KEEP" | grep -Eq '^[0-9]+$'; then
            IMAGE_KEEP=3
          fi

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not found on runner"
            exit 1
          fi
          if ! docker compose version >/dev/null 2>&1; then
            echo "docker compose plugin not found on runner"
            exit 1
          fi
          docker info >/dev/null

          REF_NAME="${GITHUB_REF_NAME:-manual}"
          SAFE_REF="$(printf '%s' "$REF_NAME" | tr '/:@ ' '----' | tr -cd 'A-Za-z0-9_.-')"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          IMAGE_REPO="ai-manger-shanghai"
          IMAGE="${IMAGE_REPO}:${SAFE_REF}-${SHORT_SHA}"
          COMPOSE_PROJECT_NAME="ai-manger-shanghai"
          COMPOSE_FILE_PATH="server/docker-compose.shanghai.yml"

          # 只装 prod 依赖 + 打包 CI 产物，服务器上不跑 tsc / astro
          echo "Build image: $IMAGE"
          docker build \
            --pull \
            -f server/Dockerfile.prebuilt \
            --label app=ai-manger-shanghai \
            --label deploy-ref="$REF_NAME" \
            --label git-sha="$(git rev-parse HEAD)" \
            -t "$IMAGE" \
            .

          ENV_FILE="${RUNNER_TEMP:-/tmp}/ai-manger-shanghai.env"
          rm -f "$ENV_FILE"
          # 优先用 shanghai 专属 secret，没有就回落到 newnew 那份
          if [ -n "${SHANGHAI_ENV_B64:-}" ]; then
            echo "Env source: SHANGHAI_ENV_B64"
            printf '%s' "$SHANGHAI_ENV_B64" | base64 -d > "$ENV_FILE"
          elif [ -n "${SHANGHAI_ENV:-}" ]; then
            echo "Env source: SHANGHAI_ENV"
            printf '%s\n' "$SHANGHAI_ENV" > "$ENV_FILE"
          elif [ -n "${NEWNEW_ENV_B64:-}" ]; then
            echo "Env source: NEWNEW_ENV_B64 (fallback)"
            printf '%s' "$NEWNEW_ENV_B64" | base64 -d > "$ENV_FILE"
          elif [ -n "${NEWNEW_ENV:-}" ]; then
            echo "Env source: NEWNEW_ENV (fallback)"
            printf '%s\n' "$NEWNEW_ENV" > "$ENV_FILE"
          else
            echo "Missing GitHub secret: need SHANGHAI_ENV(_B64) or NEWNEW_ENV(_B64)"
            exit 1
          fi
          chmod 600 "$ENV_FILE"
          if [ ! -s "$ENV_FILE" ]; then
            echo "Generated env file is empty"
            exit 1
          fi

          echo "=== Proxy keys in deployment env (values masked) ==="
          for proxy_key in \
            PROXY_ENABLED HTTPS_PROXY HTTP_PROXY ALL_PROXY NO_PROXY \
            DEV_PROXY_ENABLED DEV_HTTPS_PROXY DEV_HTTP_PROXY DEV_ALL_PROXY \
            https_proxy http_proxy all_proxy no_proxy; do
            if grep -Eq "^${proxy_key}=.+" "$ENV_FILE"; then
              echo "${proxy_key}=<set>"
            else
              echo "${proxy_key}=<unset>"
            fi
          done

          existing_container="$(docker ps -aq -f "name=^/${CONTAINER_NAME}$" || true)"
          if [ -n "$existing_container" ]; then
            existing_project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$CONTAINER_NAME" 2>/dev/null || true)"
            if [ "$existing_project" != "$COMPOSE_PROJECT_NAME" ]; then
              echo "Remove legacy non-compose container: $CONTAINER_NAME"
              docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            fi
          fi

          export AI_MANGER_SHANGHAI_IMAGE="$IMAGE"
          export SHANGHAI_ENV_FILE="$ENV_FILE"
          export APP_PORT="$APP_PORT"
          export CONTAINER_NAME="$CONTAINER_NAME"

          # Compose 的 shell 环境优先级高于 --env-file，避免 runner 自身代理覆盖部署 Secret。
          unset PROXY_ENABLED HTTPS_PROXY HTTP_PROXY ALL_PROXY NO_PROXY
          unset DEV_PROXY_ENABLED DEV_HTTPS_PROXY DEV_HTTP_PROXY DEV_ALL_PROXY
          unset https_proxy http_proxy all_proxy no_proxy

          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE_PATH" \
            config >/dev/null

          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE_PATH" \
            up -d --remove-orphans

          echo "=== Compose status ==="
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE_PATH" \
            ps || true

          echo "=== MongoDB logs ==="
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE_PATH" \
            logs --tail 80 mongodb || true

          echo "=== App logs ==="
          docker logs "$CONTAINER_NAME" --tail 120 || true

          echo "=== Effective proxy settings in app container ==="
          docker exec "$CONTAINER_NAME" node -e '
            const keys = ["PROXY_ENABLED", "HTTPS_PROXY", "HTTP_PROXY", "ALL_PROXY", "NO_PROXY", "https_proxy", "http_proxy", "all_proxy", "no_proxy"];
            for (const key of keys) {
              const value = String(process.env[key] ?? "").trim();
              if (!value) {
                console.log(`${key}=<unset>`);
              } else if (key === "PROXY_ENABLED") {
                console.log(`${key}=${value === "true" ? "true" : value === "false" ? "false" : "<invalid>"}`);
              } else if (key.toLowerCase() === "no_proxy") {
                console.log(`${key}=<set, ${value.split(",").filter(Boolean).length} entries>`);
              } else {
                try {
                  const url = new URL(value);
                  const endpoint = `${url.protocol}//${url.hostname}${url.port ? `:${url.port}` : ""}`;
                  console.log(`${key}=<set, ${endpoint}, auth=${url.username || url.password ? "yes" : "no"}>`);
                } catch {
                  console.log(`${key}=<set, invalid URL>`);
                }
              }
            }
          ' || true

          rm -f "$ENV_FILE"

          echo "Cleanup old shanghai images, keeping latest $IMAGE_KEEP"
          docker image ls "$IMAGE_REPO" --filter "label=app=ai-manger-shanghai" --format '{{.Repository}}:{{.Tag}}' \
            | awk -v keep="$IMAGE_KEEP" 'NR > keep { print }' \
            | while IFS= read -r old_image; do
                if [ -n "$old_image" ] && [ "$old_image" != "$IMAGE" ]; then
                  docker rmi "$old_image" || true
                fi
              done

          docker image prune -f --filter "label=app=ai-manger-shanghai" || true
          docker builder prune -f --filter "until=168h" || true

          echo "Deployed $IMAGE as $CONTAINER_NAME on port $APP_PORT"
