name: manual-build-deploy

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      deploy_path:
        description: 部署目录（相对路径会自动拼接到 Runner 工作目录）
        type: string
        required: true
        default: "ai-manger"
      env_file_path:
        description: Runner 上的环境文件路径（可选，留空则沿用部署目录中的 .env）
        type: string
        required: false
        default: ""
      app_port:
        description: 对外端口映射到容器 3011
        type: string
        required: false
        default: "3011"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install pnpm globally
        run: |
          npm i -g pnpm@9
          echo "$(npm bin -g)" >> $GITHUB_PATH
          pnpm -v

      - name: Compute pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NestJS
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Build frontend pages
        run: |
          pnpm --dir web install --frozen-lockfile --prod=false
          pnpm --dir web run build
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-mvp-dist
          path: |
            dist
            migrations
            public
            package.json
            pnpm-lock.yaml
          retention-days: 1

  deploy:
    needs: build
    runs-on:
      - new-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-mvp-dist
          path: ./artifact

      - name: Resolve deploy path
        run: |
          INPUT_DP="${{ inputs.deploy_path }}"

          if [ -n "${RUNNER_WORKSPACE:-}" ]; then
            BASE_DIR="$RUNNER_WORKSPACE"
          else
            BASE_DIR="$(cd "$GITHUB_WORKSPACE/../.." && pwd -P)"
          fi

          case "$INPUT_DP" in
            /*) DP="$INPUT_DP" ;;
            *) DP="$BASE_DIR/$INPUT_DP" ;;
          esac

          mkdir -p "$DP"
          echo "DEPLOY_PATH=$DP" >> "$GITHUB_ENV"

          echo "RUNNER_WORKSPACE: ${RUNNER_WORKSPACE:-<empty>}"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "Runner base dir: $BASE_DIR"
          echo "Deploy path: $DP"

      - name: Sync source code to deploy path
        run: |
          DP="$DEPLOY_PATH"
          WS_REAL="$(cd "$GITHUB_WORKSPACE" && pwd -P)"

          mkdir -p "$DP"
          DP_REAL="$(cd "$DP" && pwd -P)"

          case "$DP_REAL" in
            "$WS_REAL"/*)
              echo "Deploy path cannot be inside GITHUB_WORKSPACE: $DP_REAL"
              exit 1
              ;;
          esac

          if command -v rsync >/dev/null 2>&1; then
            rsync -a "$GITHUB_WORKSPACE"/ "$DP"/
          else
            cp -a "$GITHUB_WORKSPACE"/. "$DP"/
          fi

          echo "$GITHUB_SHA" > "$DP/.deploy-commit"

          echo "Source code synced: $DP"
          echo "Deploy commit: $GITHUB_SHA"

      - name: Prepare target directory
        run: |
          DP="$DEPLOY_PATH"
          rm -rf "$DP/dist"
          mkdir -p "$DP/public"

          echo "=== Artifact directory ==="
          if [ ! -d "./artifact" ]; then
            echo "✗ ./artifact not found"; pwd; ls -la | head -50; exit 1
          fi
          ls -la ./artifact | head -50

          cp -r ./artifact/dist "$DP/"
          if [ -d ./artifact/migrations ]; then
            cp -r ./artifact/migrations "$DP/"
          fi
          if [ -d ./artifact/public ]; then
            cp -r ./artifact/public/. "$DP/public/"
          fi
          cp ./artifact/package.json "$DP/"
          if [ -f ./artifact/pnpm-lock.yaml ]; then cp ./artifact/pnpm-lock.yaml "$DP/"; fi

      - name: Optional env file copy
        run: |
          SRC="${{ inputs.env_file_path }}"
          DST="$DEPLOY_PATH/.env"

          if [ -n "$SRC" ] && [ ! -f "$SRC" ]; then
            REPO_CANDIDATE="$GITHUB_WORKSPACE/$SRC"
            WORKSPACE_CANDIDATE="${RUNNER_WORKSPACE:-$GITHUB_WORKSPACE}/$SRC"
            if [ -f "$REPO_CANDIDATE" ]; then
              SRC="$REPO_CANDIDATE"
            elif [ -f "$WORKSPACE_CANDIDATE" ]; then
              SRC="$WORKSPACE_CANDIDATE"
            fi
          fi

          if [ -n "$SRC" ] && [ -f "$SRC" ] && [ "$SRC" != "$DST" ]; then
            cp -f "$SRC" "$DST"
          fi

      - name: Place server docker yml
        run: |
          cp -f server/docker-compose.yml "$DEPLOY_PATH/docker-compose.yml"

      - name: Verify files before docker run
        run: |
          DP="$DEPLOY_PATH"
          ls -la "$DP" | head -50
          test -f "$DP/package.json" && echo "✓ package.json" || (echo "✗ package.json missing" && exit 1)
          test -f "$DP/pnpm-lock.yaml" && echo "✓ pnpm-lock.yaml" || echo "! pnpm-lock.yaml missing"
          test -f "$DP/dist/main.js" && echo "✓ dist/main.js" || (echo "✗ dist/main.js missing" && exit 1)
          test -d "$DP/public/pages" && echo "✓ public/pages" || echo "! public/pages missing"
          test -f "$DP/.env" && echo "✓ .env" || (echo "✗ .env missing" && exit 1)

      - name: Rebuild and Redeploy Docker app
        run: |
          DP="$DEPLOY_PATH"

          APP_PORT="${{ inputs.app_port }}"; [ -z "$APP_PORT" ] && APP_PORT=3011
          export APP_PORT
          export APP_ROOT="$DP"

          if command -v docker >/dev/null 2>&1; then
            if [ -f "$DP/docker-compose.yml" ]; then
              if docker compose version >/dev/null 2>&1; then
                docker compose -f "$DP/docker-compose.yml" --project-directory "$DP" up -d --build --force-recreate --remove-orphans
              elif command -v docker-compose >/dev/null 2>&1; then
                docker-compose -f "$DP/docker-compose.yml" --project-directory "$DP" up -d --build --force-recreate --remove-orphans
              else
                echo "docker compose not available"
                exit 1
              fi
            else
              echo "docker-compose.yml missing in deploy path"
              exit 1
            fi
          else
            echo "docker not found"
            exit 1
          fi

          echo "=== Container logs ==="
          docker logs ai_mvp_app 2>&1 | tail -80 || true

      - name: Cleanup local artifact
        run: rm -rf ./artifact
