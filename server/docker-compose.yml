services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ai_mvp_app
    working_dir: /app
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3011}
      # Node 多进程：worker 数（1 关闭；auto 按 CPU 核数）。每个 worker 各占一份内存
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-2}
      # 多进程内存预算（MB）：不填时取容器内存上限（mem_limit），再没有就取整机内存一半；按它给每个 worker 定堆上限
      CLUSTER_MEMORY_BUDGET_MB: ${CLUSTER_MEMORY_BUDGET_MB:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_ROOT:-/www/ace.c/ai-manger}:/app
    ports:
      - ${APP_PORT:-3011}:3011
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3011/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
