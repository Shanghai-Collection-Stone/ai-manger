services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ai_mvp_app
    working_dir: /app
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3011}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_ROOT:-/www/ace.c/ai-manger}:/app
    ports:
      - ${APP_PORT:-3011}:3011
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3011/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
