name: ai-manger-shanghai

services:
  mongodb:
    image: mongo:7.0
    container_name: ${MONGO_CONTAINER_NAME:-ai_manger_shanghai_mongodb}
    restart: unless-stopped
    # 不封顶时 mongo 会按整机内存的一半开 WiredTiger cache，和同机 Node 应用抢内存。
    # MONGO_WT_CACHE_GB 建议设为 mem_limit 的一半左右。
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_WT_CACHE_GB:-0.25}"]
    mem_limit: ${MONGO_MEM_LIMIT:-768m}
    # 整机内存耗尽时内核优先杀其他进程，不先杀数据库（应用 worker 会主动调高自己的分值）
    oom_score_adj: -500
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:?set MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASS:?set MONGODB_PASS}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-ai_system_shanghai}
    volumes:
      - ai_manger_shanghai_mongo_data:/data/db
      - ai_manger_shanghai_mongo_config:/data/configdb
    networks:
      - shanghai
    healthcheck:
      # mongosh 会额外启动 Node.js 运行时，在小内存主机上容易触发换页并拖垮健康检查。
      # TCP 探测只验证 mongod 已监听；应用自身负责数据库鉴权与连接重试。
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/27017'"]
      interval: 60s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    image: ${AI_MANGER_SHANGHAI_IMAGE:?set AI_MANGER_SHANGHAI_IMAGE}
    container_name: ${CONTAINER_NAME:-ai_manger_shanghai_app}
    restart: unless-stopped
    env_file:
      - ${SHANGHAI_ENV_FILE:-../.env.shanghai}
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3011
      # Node 多进程：worker 数（1 关闭；auto 按 CPU 核数）。每个 worker 各占一份内存
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-2}
      # 多进程内存预算（MB）：不填时取容器内存上限（mem_limit），再没有就取整机内存一半；按它给每个 worker 定堆上限
      CLUSTER_MEMORY_BUDGET_MB: ${CLUSTER_MEMORY_BUDGET_MB:-}

      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USER: ${MONGODB_USER:?set MONGODB_USER}
      MONGODB_PASS: ${MONGODB_PASS:?set MONGODB_PASS}
      MONGODB_DB: ${MONGODB_DB:-ai_system_shanghai}
      MONGODB_AUTH_SOURCE: admin
      MONGODB_TOPOLOGY: standalone
      MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGODB_USER}:${MONGODB_PASS}@mongodb:27017/?authSource=admin&directConnection=true}

      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?set ADMIN_BOOTSTRAP_PASSWORD}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?set ADMIN_JWT_SECRET}

      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      APP_URL: ${APP_URL:-}
      BASE_URL: ${BASE_URL:-}
      TASK_API_BASE_URL: ${TASK_API_BASE_URL:-}

      PROXY_ENABLED: ${PROXY_ENABLED:-${DEV_PROXY_ENABLED:-true}}
      HTTPS_PROXY: ${HTTPS_PROXY:-${HTTP_PROXY:-${ALL_PROXY:-${https_proxy:-${http_proxy:-${all_proxy:-${DEV_HTTPS_PROXY:-${DEV_HTTP_PROXY:-${DEV_ALL_PROXY:-}}}}}}}}}
      HTTP_PROXY: ${HTTP_PROXY:-${HTTPS_PROXY:-${ALL_PROXY:-${http_proxy:-${https_proxy:-${all_proxy:-${DEV_HTTP_PROXY:-${DEV_HTTPS_PROXY:-${DEV_ALL_PROXY:-}}}}}}}}}
      ALL_PROXY: ${ALL_PROXY:-${all_proxy:-${DEV_ALL_PROXY:-}}}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,ai_manger_shanghai_mongodb,.aliyuncs.com}
      https_proxy: ${https_proxy:-${HTTPS_PROXY:-${HTTP_PROXY:-${ALL_PROXY:-${DEV_HTTPS_PROXY:-${DEV_HTTP_PROXY:-${DEV_ALL_PROXY:-}}}}}}}
      http_proxy: ${http_proxy:-${HTTP_PROXY:-${HTTPS_PROXY:-${ALL_PROXY:-${DEV_HTTP_PROXY:-${DEV_HTTPS_PROXY:-${DEV_ALL_PROXY:-}}}}}}}
      all_proxy: ${all_proxy:-${ALL_PROXY:-${DEV_ALL_PROXY:-}}}
      no_proxy: ${no_proxy:-${NO_PROXY:-localhost,127.0.0.1,::1,mongodb,ai_manger_shanghai_mongodb,.aliyuncs.com}}

      SUPER_PARTY_MONGODB_HOST: ${SUPER_PARTY_MONGODB_HOST:-}
      SUPER_PARTY_MONGODB_PORT: ${SUPER_PARTY_MONGODB_PORT:-27017}
      SUPER_PARTY_MONGODB_DB: ${SUPER_PARTY_MONGODB_DB:-}
      SUPER_PARTY_MONGODB_USER: ${SUPER_PARTY_MONGODB_USER:-}
      SUPER_PARTY_MONGODB_PASS: ${SUPER_PARTY_MONGODB_PASS:-}
      SUPER_PARTY_MONGODB_AUTH_SOURCE: ${SUPER_PARTY_MONGODB_AUTH_SOURCE:-}

      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}

      MEITU_AK: ${MEITU_AK:-}
      MEITU_SK: ${MEITU_SK:-}
      OPEN_CLAW_AK: ${OPEN_CLAW_AK:-}
      OPEN_CLAW_SK: ${OPEN_CLAW_SK:-}
      MEITU_CLI_BIN: ${MEITU_CLI_BIN:-}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      IMAGE_GROUP_RENDER_CONCURRENCY: ${IMAGE_GROUP_RENDER_CONCURRENCY:-1}
      COVER_FONT_PATH: ${COVER_FONT_PATH:-}
      DECISION_PROVIDER: ${DECISION_PROVIDER:-}
      DECISION_MODEL: ${DECISION_MODEL:-}
      TOOL_DEBUG: ${TOOL_DEBUG:-}

      MCP_STORAGE_DIR: ${MCP_STORAGE_DIR:-/app/storage/mcp}
      MCP_TOOL_TIMEOUT_MS: ${MCP_TOOL_TIMEOUT_MS:-}

      FINANCE_PUSH_WEBHOOK_SECRET: ${FINANCE_PUSH_WEBHOOK_SECRET:-}
      FINANCE_WEBHOOK_SECRET: ${FINANCE_WEBHOOK_SECRET:-}
      SASS_SYNC_ORDER_SCHEMA_ID: ${SASS_SYNC_ORDER_SCHEMA_ID:-}
      SASS_SYNC_USAGE_SCHEMA_ID: ${SASS_SYNC_USAGE_SCHEMA_ID:-}
      SASS_SYNC_REFUND_SCHEMA_ID: ${SASS_SYNC_REFUND_SCHEMA_ID:-}
      ARTICLE_LIBRARY_XHS_QR_SHORT_LINK: ${ARTICLE_LIBRARY_XHS_QR_SHORT_LINK:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-3011}:3011"
    volumes:
      - ai_manger_shanghai_uploads:/app/public/uploads
      - ai_manger_shanghai_uploads_thumbs:/app/public/uploads_thumbs
      - ai_manger_shanghai_uploads_zips:/app/public/uploads_zips
      - ai_manger_shanghai_data:/app/data
      - ai_manger_shanghai_storage:/app/storage
    networks:
      - shanghai
    healthcheck:
      disable: true

networks:
  shanghai:
    name: ai_manger_shanghai_network

volumes:
  ai_manger_shanghai_mongo_data:
  ai_manger_shanghai_mongo_config:
  ai_manger_shanghai_uploads:
  ai_manger_shanghai_uploads_thumbs:
  ai_manger_shanghai_uploads_zips:
  ai_manger_shanghai_data:
  ai_manger_shanghai_storage:
